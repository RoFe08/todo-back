name: Build, Push and Deploy (SSM)

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read
  id-token: write

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: stefanini-todo-back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build (Maven)
        run: ./mvnw -DskipTests clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # =========================
      # Deploy via AWS SSM (main)
      # =========================
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM Run Command
        if: github.ref == 'refs/heads/main'
        run: |
          aws ssm send-command \
            --document-name "${{ secrets.SSM_DOCUMENT_NAME }}" \
            --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --comment "Deploy backend via docker compose" \
            --parameters "appDir=${{ secrets.EC2_APP_DIR }}" \
            --timeout-seconds 600 \
            --max-concurrency "1" \
            --max-errors "0"
