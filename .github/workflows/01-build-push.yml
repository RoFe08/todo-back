name: Deploy via SSM (EC2)

on:
  workflow_run:
    workflows: ["Build & Push (DockerHub)"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # só roda se:
    # - for manual (workflow_dispatch), OU
    # - workflow anterior concluiu com sucesso E foi na main
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy using SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ secrets.SSM_DOCUMENT_NAME }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -e
          aws ssm send-command \
            --document-name "${DOCUMENT_NAME}" \
            --targets "Key=instanceids,Values=${INSTANCE_ID}" \
            --comment "Deploy backend via docker compose" \
            --parameters "{\"appDir\":[\"${APP_DIR}\"]}" \
            --timeout-seconds 600 \
            --max-concurrency "1" \
            --max-errors "0"
