services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: todo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sqlserver:/docker-entrypoint-initdb.d
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr &
      /docker-entrypoint-initdb.d/init-db.sh &&
      wait
      "
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - todo-net

  backend:
    image: rofe08/todo-backend:latest   # depois você troca pro nome do seu DockerHub
    container_name: todo-backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=todo_db
      - DB_USERNAME=sa
      - DB_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - todo-net

volumes:
  sqlserver_data:

networks:
  todo-net:
    driver: bridge
