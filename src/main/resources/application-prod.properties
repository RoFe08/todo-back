# ======================
# SERVER
# ======================
server.port=8080

  # ======================
  # DATASOURCE (DOCKER / EC2)
  # ======================
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT:1433};databaseName=${DB_NAME:todo_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ======================
  # JPA / HIBERNATE
  # ======================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

  # ======================
  # FLYWAY
  # ======================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

server.servlet.context-path=/api

security.jwt.secret=IHVtYS1jaGF2ZS1iZW0tZ3JhbmRlLWUtc2VjcmV0YS1tZXNtby1hcXVpLXBhcmEtYXNzaW5hci1vLXRva2Vu
security.jwt.expiration-ms=86400000